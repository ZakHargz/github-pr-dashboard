<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Amber rounded-square background matching the app's --primary colour -->
  <rect width="32" height="32" rx="7" fill="#d97706"/>
  <!-- Git branch lines evoking a PR merge -->
  <circle cx="9"  cy="9"  r="2.5" fill="white" opacity="0.9"/>
  <circle cx="9"  cy="23" r="2.5" fill="white" opacity="0.9"/>
  <circle cx="23" cy="14" r="2.5" fill="white" opacity="0.9"/>
  <line x1="9"  y1="11.5" x2="9"  y2="20.5" stroke="white" stroke-width="1.8" stroke-opacity="0.9" stroke-linecap="round"/>
  <path d="M9 11.5 Q9 14 23 14" fill="none" stroke="white" stroke-width="1.8" stroke-opacity="0.9" stroke-linecap="round"/>
  <!-- "PR" label -->
  <text x="16" y="29" font-family="system-ui,-apple-system,sans-serif" font-size="8.5" font-weight="800" fill="white" text-anchor="middle" letter-spacing="0.5">PR</text>
</svg>
